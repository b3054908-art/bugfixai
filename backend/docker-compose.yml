services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugfixai
      POSTGRES_PASSWORD: bugfixai
      POSTGRES_DB: bugfixai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugfixai -d bugfixai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "6379:6379"

volumes:
  postgres_data: